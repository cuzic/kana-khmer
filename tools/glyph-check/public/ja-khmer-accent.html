<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glyph Check: ja-khmer accent</title>
<link rel="stylesheet" href="fonts/noto-sans/400.css">
<link rel="stylesheet" href="fonts/noto-sans-jp/400.css">
<link rel="stylesheet" href="fonts/noto-sans-khmer/400.css">
<style>
  /* Prototype for ADR-0021: pitch-accent overline drawn in the DOM. Each visible slot (base syllable / final consonant /
     shoulder mark / long marker) is an inline-block; every mora it carries gets an absolutely positioned overlay
     (.ln.H = top line, .ln.D = drop step on the right edge), so the lines never change slot widths. Font stacks as ja-khmer.html. */
  @font-face { font-family: "Ja Khmer"; src: url("ja-khmer-font/ja-khmer.woff2") format("woff2"); }
  :root { --bg:#fff; --fg:#111; --line:#ccc; --ng:#c00; --ok:#080; --acc:#c40; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111; --fg:#eee; --line:#444; --ng:#f66; --ok:#6c6; --acc:#fa6; } }
  body { margin:0; padding:12px 16px; background:var(--bg); color:var(--fg); font:14px/1.5 sans-serif; }
  h1 { font-size:16px; margin:0 0 4px; }
  h2 { font-size:14px; margin:16px 0 4px; }
  #status { font-weight:bold; margin-bottom:8px; }
  .ok { color:var(--ok); } .ng { color:var(--ng); }
  .sys .kh { font-family: sans-serif; }
  .ja .kh { font-family: "Ja Khmer", "Noto Sans Khmer", "Noto Sans", sans-serif; }
  .sys .kn { font-family: sans-serif; }
  .ja .kn { font-family: "Noto Sans JP", sans-serif; }
  .item { border-bottom:1px solid var(--line); padding:6px 0 8px; }
  .meta { font-size:11px; opacity:.75; }
  .line { display:flex; align-items:baseline; gap:10px; margin-top:2px; }
  .line .tag { flex:0 0 3.2em; font-size:10px; opacity:.6; }
  .wd { white-space:nowrap; font-size:34px; line-height:1; }
  .kn .wd { font-size:28px; }
  .sl { display:inline-block; position:relative; padding-top:.42em; line-height:1.3; }
  .ln { position:absolute; top:0; bottom:0; box-sizing:border-box; pointer-events:none; color:var(--acc); }
  .ln.H { border-top:2px solid currentColor; }
  .ln.H.D { border-right:2px solid currentColor; }
  .plain .wd { line-height:1.3; padding-top:.42em; }
  .plain { opacity:.6; }
  pre { font-size:11px; white-space:pre-wrap; word-break:break-all; }
</style>
</head>
<body>
<h1>Glyph Check: ja-khmer accent line (ADR-0021 prototype)</h1>
<p style="font-size:12px;opacity:.75">
  H の拍にだけ上線、下がり目は線の右端の縦の段。上段はクメール文字、下段はかな。3段目 (薄字) は分割なし・線なしの同じ文字列(スロット分割で字形や幅が変わっていないかの比較)。
  語のアクセント型は<b>レイアウト確認用のサンプル</b>で、確認済みデータではない。合否は目視。自動判定は幾何(スロット幅・上端の揃い・隣接・線と字の間隔)のみ。
</p>
<div id="status">running…</div>
<div id="root"></div>
<h2>report</h2>
<pre id="report"></pre>

<script src="ja-khmer-accent-data.js"></script>
<script>
const params = new URLSearchParams(location.search);
const platform = params.get("platform") || "unknown";
const modeParam = params.get("mode");
const MODES = modeParam ? [modeParam] : ["sys", "ja"];
const TYPE = (n, N) => n === 0 ? "平板" : n === 1 ? "頭高" : n === N ? "尾高" : "中高";

function overlays(slot, moras) {
  // one overlay per mora the slot carries; two moras in one glyph (あい = ៃ) split the slot width in half
  const k = moras.length;
  moras.forEach(function (m, j) {
    if (!m.H) return;
    const o = document.createElement("i");
    o.className = "ln H" + (m.drop ? " D" : "");
    o.style.left = (100 * j / k) + "%"; o.style.width = (100 / k) + "%";
    slot.appendChild(o);
  });
}
function slotEl(text, moras) {
  const s = document.createElement("span"); s.className = "sl"; s.textContent = text;
  overlays(s, moras); return s;
}
function khmerLine(w) {
  const wd = document.createElement("span"); wd.className = "wd";
  // a slot with no mora (the ˢʰ shoulder mark) takes the height of the base slot before it
  let prev = [];
  for (const s of w.slots) {
    const ms = s.moras.length ? s.moras.map(i => w.moras[i]) : prev.map(m => ({ H: m.H, drop: false }));
    if (s.moras.length) prev = ms;
    const el = slotEl(s.text, ms); el.dataset.kind = s.kind; wd.appendChild(el);
  }
  return wd;
}
function kanaLine(w) {
  const wd = document.createElement("span"); wd.className = "wd";
  w.moras.forEach(m => { const el = slotEl(m.text, [m]); el.dataset.kind = "mora"; wd.appendChild(el); });
  return wd;
}
function plainLine(text) {
  const wd = document.createElement("span"); wd.className = "wd"; wd.textContent = text; return wd;
}
function line(tag, cls, wd) {
  const d = document.createElement("div"); d.className = "line " + cls;
  const t = document.createElement("span"); t.className = "tag"; t.textContent = tag;
  d.appendChild(t); d.appendChild(wd); return d;
}
const HL = w => w.moras.map(m => (m.H ? "H" : "L") + (m.drop ? "\\" : "")).join("");

for (const mode of MODES) {
  const h = document.createElement("h2"); h.textContent = mode === "sys" ? "sys (sans-serif、同梱フォントなし)" : "ja (Ja Khmer + Noto Sans Khmer + Noto Sans JP 同梱)";
  document.getElementById("root").appendChild(h);
  const box = document.createElement("div"); box.className = mode; box.id = "mode-" + mode;
  for (const w of JA_ACCENT_WORDS) {
    const it = document.createElement("div"); it.className = "item"; it.dataset.idx = JA_ACCENT_WORDS.indexOf(w);
    const meta = document.createElement("div"); meta.className = "meta";
    meta.textContent = w.kata + " n=" + w.n + " " + TYPE(w.n, w.moras.length) + "  " + HL(w) + "  " + w.note;
    it.appendChild(meta);
    const kh = line("Khmer", "kh", khmerLine(w)); it.appendChild(kh);
    it.appendChild(line("かな", "kn", kanaLine(w)));
    it.appendChild(line("分割なし", "kh plain", plainLine(w.khmer)));
    box.appendChild(it);
  }
  document.getElementById("root").appendChild(box);
}

// ---- self check (geometry only; the look is judged by eye) ----
const cv = document.createElement("canvas"); const ctx = cv.getContext("2d");
function ink(text, el) { // ink ascent above the baseline of this slot, via canvas with the slot's computed font
  const cs = getComputedStyle(el); ctx.font = cs.fontStyle + " " + cs.fontWeight + " " + cs.fontSize + " " + cs.fontFamily;
  return ctx.measureText(text).actualBoundingBoxAscent;
}
function baselineY(el) { // bottom of a zero-size inline-block at the end of the slot = its baseline; removed again
  const p = document.createElement("b"); p.style.cssText = "display:inline-block;width:0;height:0";
  el.appendChild(p); const y = p.getBoundingClientRect().bottom; el.removeChild(p); return y;
}
function check(mode) {
  const res = [], box = document.getElementById("mode-" + mode);
  for (const it of box.querySelectorAll(".item")) {
    const w = JA_ACCENT_WORDS[Number(it.dataset.idx)];
    const lines = it.querySelectorAll(".line");
    const label = w.kata + " n=" + w.n;
    // 1 slot widths add up to the unsplit string (ADR-0003: splitting must not change shaping/advances)
    const khSlots = [...lines[0].querySelectorAll(".sl")];
    const sum = khSlots.reduce((a, s) => a + s.getBoundingClientRect().width, 0);
    const whole = lines[2].querySelector(".wd").getBoundingClientRect().width;
    res.push({ mode, item: label + " khmer slot widths sum == unsplit", ok: Math.abs(sum - whole) < 1, widths: { sum, whole } });
    // 2 slots share one top and abut (a continuous line needs no gaps)
    for (const [nm, slots] of [["khmer", khSlots], ["kana", [...lines[1].querySelectorAll(".sl")]]]) {
      const r = slots.map(s => s.getBoundingClientRect());
      const tops = r.every(x => Math.abs(x.top - r[0].top) < 0.5);
      const abut = r.every((x, i) => i === 0 || Math.abs(x.left - r[i - 1].right) < 0.5);
      res.push({ mode, item: label + " " + nm + " slot tops equal", ok: tops, tops: r.map(x => x.top) });
      res.push({ mode, item: label + " " + nm + " slots abut", ok: abut });
    }
    // 3 the H line sits above the ink of every slot (gap >= 1px) and the drop step reaches below the baseline
    for (const [nm, slots] of [["khmer", khSlots], ["kana", [...lines[1].querySelectorAll(".sl")]]]) {
      let minGap = 1e9;
      for (const s of slots) {
        if (!s.querySelector(".ln.H")) continue;
        const top = s.getBoundingClientRect().top;
        const inkTop = baselineY(s) - ink(s.firstChild.textContent, s);
        minGap = Math.min(minGap, inkTop - (top + 2));
      }
      res.push({ mode, item: label + " " + nm + " line-to-ink gap >= 1px", ok: minGap >= 1 || minGap === 1e9, minGap });
    }
    // 4 number of top-line overlays == number of H moras (ai half lines included), same for both rows
    const hm = w.moras.filter(m => m.H).length;
    let expect = 0, prevH = 0;
    for (const sl of w.slots) { if (sl.moras.length) { prevH = sl.moras.filter(i => w.moras[i].H).length; expect += prevH; } else expect += prevH ? 1 : 0; }
    res.push({ mode, item: label + " khmer H overlays == expected", ok: lines[0].querySelectorAll(".ln.H").length === expect });
    res.push({ mode, item: label + " kana H overlays == H moras", ok: lines[1].querySelectorAll(".ln.H").length === hm });
    // 5 ai: two half overlays inside one slot, each half the slot width
    for (const s of khSlots) {
      const os = s.querySelectorAll(".ln.H"); if (os.length !== 2) continue;
      const a = os[0].getBoundingClientRect(), b = os[1].getBoundingClientRect(), sr = s.getBoundingClientRect();
      res.push({ mode, item: label + " split slot halves tile the slot", ok: Math.abs(a.width - sr.width / 2) < 1 && Math.abs(b.left - a.right) < 0.5 && Math.abs(b.right - sr.right) < 1 });
    }
  }
  return res;
}

(async () => {
  try {
    await Promise.all([
      document.fonts.load('400 34px "Ja Khmer"', "ᵃᵒ̄ˢʰ"),
      document.fonts.load('400 34px "Noto Sans Khmer"', "តូឆូអា"),
      document.fonts.load('400 34px "Noto Sans JP"', "ニホンジン"),
    ]);
    await document.fonts.ready;
    const results = MODES.flatMap(check);
    const failed = results.filter(r => !r.ok);
    const report = {
      platform, ua: navigator.userAgent, dpr: devicePixelRatio,
      fontsLoaded: [...document.fonts].filter(x => x.status === "loaded").map(x => x.family),
      failed: failed.length, results,
    };
    const st = document.getElementById("status");
    st.textContent = failed.length ? "FAILED " + failed.length + "/" + results.length : "ALL OK " + results.length;
    st.className = failed.length ? "ng" : "ok";
    document.getElementById("report").textContent = JSON.stringify(failed, null, 1) || "";
    await fetch("/report?platform=" + encodeURIComponent(platform), {
      method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(report),
    });
    document.title = "DONE";
  } catch (e) {
    document.getElementById("status").textContent = "ERROR " + e;
    await fetch("/report?platform=" + encodeURIComponent(platform), {
      method: "POST", body: JSON.stringify({ platform, error: String(e) }),
    }).catch(function () {});
  }
})();
</script>
</body>
</html>
