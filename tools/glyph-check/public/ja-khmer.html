<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glyph Check: ja-khmer</title>
<link rel="stylesheet" href="fonts/noto-sans/400.css">
<link rel="stylesheet" href="fonts/noto-sans-khmer/400.css">
<style>
  /* Ja Khmer = superscript romaji (standard h shape) + 5 long-vowel composites. NOT kana-support.woff2 (its ʰ is the
     ADR-0015 custom shape). Khmer letters come from Noto Sans Khmer, loaded separately (docs: build-ja-khmer-font.py).
     Ja Khmer must come first in the stack: fontsource's Noto Sans Khmer declares U+0304 and U+1D00-1DBF in its
     unicode-range, so listing it first would draw the vowel and the macron from a different font. */
  @font-face { font-family: "Ja Khmer"; src: url("ja-khmer-font/ja-khmer.woff2") format("woff2"); }
  :root { --bg:#fff; --fg:#111; --line:#ccc; --ng:#c00; --ok:#080; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111; --fg:#eee; --line:#444; --ng:#f66; --ok:#6c6; } }
  body { margin:0; padding:12px 16px; background:var(--bg); color:var(--fg); font:14px/1.5 sans-serif; }
  h1 { font-size:16px; margin:0 0 4px; }
  h2 { font-size:14px; margin:16px 0 4px; }
  #status { font-weight:bold; margin-bottom:8px; }
  .ok { color:var(--ok); } .ng { color:var(--ng); }
  .sys { font-family: sans-serif; }
  .ja { font-family: "Ja Khmer", "Noto Sans Khmer", "Noto Sans", sans-serif; }
  .row { display:flex; gap:12px; align-items:baseline; border-bottom:1px solid var(--line); padding:4px 0; }
  .row .k { flex:0 0 9em; font-size:11px; opacity:.7; word-break:break-all; }
  .row .v { font-size:34px; }
  table { border-collapse:collapse; }
  th, td { border-bottom:1px solid var(--line); padding:2px 10px 2px 0; text-align:left; white-space:nowrap; }
  th { font-size:11px; font-weight:normal; opacity:.7; }
  td.kn { font-size:14px; font-family:sans-serif; }
  td.g { font-size:30px; line-height:1.5; }
  pre { font-size:11px; white-space:pre-wrap; word-break:break-all; }
</style>
</head>
<body>
<h1>Glyph Check: ja-khmer</h1>
<p style="font-size:12px;opacity:.75">
  日本語の音をクメール文字で書く表記(docs/ja-khmer-spec.md v0.11)の右肩ローマ字と長音マーカー。合否は目視。自動判定は tofu(欠字)と、長音の合成グリフが1グリフ幅かの補助のみ。
  表は設計書 §5 から scripts/gen-ja-khmer-rows.mjs で生成(ja-khmer-rows.js)。
</p>
<div id="status">running…</div>

<div id="sys-wrap"><h2>sys (font-family: sans-serif、同梱フォントなし)</h2><div id="sys" class="sys"></div></div>
<div id="ja-wrap"><h2>ja (Ja Khmer + Noto Sans Khmer 同梱)</h2><div id="ja" class="ja"></div></div>
<h2>report</h2>
<pre id="report"></pre>

<script src="ja-khmer-rows.js"></script>
<script>
const params = new URLSearchParams(location.search);
const platform = params.get("platform") || "unknown";

// ---- new / unverified first (a device screenshot only captures the first viewport) ----
// [label, text, note]. Combining U+0304 written as ̄ so the source stays readable.
const LONG_VOWELS = [["ā", "ᵃ"], ["ī", "ⁱ"], ["ū", "ᵘ"], ["ē", "ᵉ"], ["ō", "ᵒ"]];
const PROBES = [
  ["長音5つ ᵃ̄ ⁱ̄ ᵘ̄ ᵉ̄ ᵒ̄ (合成グリフ)", "ᵃ̄ ⁱ̄ ᵘ̄ ᵉ̄ ᵒ̄", "各マクロンが上付き母音の真上・幅がほぼ揃う。ⁱ̄ は点なし(ī 風)で、5つのバーの高さが揃う。欠字・マクロンのずれがあれば不具合"],
  ["フォールバック(重ね書き) ᵃᵃ ⁱⁱ ᵘᵘ ᵉᵉ ᵒᵒ", "ᵃᵃ ⁱⁱ ᵘᵘ ᵉᵉ ᵒᵒ", "合成グリフが崩れたときの代替。幅は2文字分"],
  ["ˢʰ(sh)単独", "ˢʰ", "ˢ と ʰ が離れず一体に見えるか。ʰ は標準の h(点+テールでない)"],
  ["ឆូˢʰ しょ", "ឆូˢʰ", "基底の右肩に ˢʰ。有気の ឆ に ʰ が続いて誤読されないか"],
  ["ឆូˢʰᵒ̄ しょう(子音の印→長音マーカーの順)", "ឆូˢʰᵒ̄", "spec §3.2 の並び。マクロンが ᵒ の真上"],
  ["តូᵒ̄ とう(合成)", "តូᵒ̄", "基底の右に1文字幅のマーカー"],
  ["តូᵒᵒ とう(フォールバック)", "តូᵒᵒ", ""],
  ["រី+ⁱ̄ 母音記号の上にマクロンが被らないか", "រីⁱ̄ ស៊ូᵘ̄ ម៉ាᵃ̄", "កា の ា / ី ូ の上付き記号と、右肩が干渉しないか"],
  ["連続する長音", "តូᵒ̄ក្យូᵘ̄ឆូˢʰᵒ̄", "2音節以上で位置がずれないか"],
  ["その他の右肩(表記外だが字形確認) ᵗ ᶜ ʲ ᶻ ᶠ ʸ ʷ", "ᵗ ᶜ ʲ ᶻ ᶠ ʸ ʷ", "設計書 §3.2 が採らなかった記号も、フォントには入っている"],
];

const FAMILIES = { sys: "sans-serif", ja: '"Ja Khmer","Noto Sans Khmer","Noto Sans",sans-serif' };
const ROWS = JA_KHMER_ROWS;

function probeRow(target, label, text, note) {
  const d = document.createElement("div"); d.className = "row";
  d.innerHTML = '<span class="k"></span><span class="v"></span><span class="k"></span>';
  d.children[0].textContent = label; d.children[1].textContent = text; d.children[2].textContent = note || "";
  document.getElementById(target).appendChild(d);
}
function table(target) {
  const t = document.createElement("table");
  t.innerHTML = "<tr><th>かな</th><th>詳細(基底+右肩)</th><th>長音 (ᵃ̄ 等)</th><th>長音 フォールバック(ᵃᵃ 等)</th></tr>";
  for (const r of ROWS) {
    const tr = document.createElement("tr");
    const cells = [[r.kana, "kn"], [r.detail, "g"], [r.longA, "g"], [r.longC, "g"]];
    for (const c of cells) { const td = document.createElement("td"); td.className = c[1]; td.textContent = c[0]; tr.appendChild(td); }
    t.appendChild(tr);
  }
  document.getElementById(target).appendChild(t);
}

const modeParam = params.get("mode");
const MODES = modeParam ? [modeParam] : ["sys", "ja"];
for (const m of ["sys", "ja"]) {
  if (!MODES.includes(m)) { document.getElementById(m + "-wrap").remove(); continue; }
  for (const p of PROBES) probeRow(m, p[0], p[1], p[2]);
  table(m);
}

// ---- self check (tofu detection + composite width; judgement is by eye) ----
const cv = document.createElement("canvas"); cv.width = 400; cv.height = 90;
const ctx = cv.getContext("2d", { willReadFrequently: true });
const SIZE = 48;
function pixels(text, family) {
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.font = SIZE + "px " + family; ctx.textBaseline = "alphabetic";
  ctx.fillStyle = "#000"; ctx.fillText(text, 8, 60);
  return ctx.getImageData(0, 0, cv.width, cv.height).data;
}
function same(a, b) { for (let i = 3; i < a.length; i += 4) if (a[i] !== b[i]) return false; return true; }
function width(text, family) { ctx.font = SIZE + "px " + family; return ctx.measureText(text).width / SIZE; }
const cp = s => [...s].map(c => c.codePointAt(0).toString(16).toUpperCase().padStart(4, "0")).join(" ");

function check(mode) {
  const f = FAMILIES[mode], res = [];
  const missing = pixels("\u{10FFFE}", f);
  const tofu = (label, text, bare) => {
    const p = pixels(text, f);
    const bad = same(p, missing) || (bare !== undefined && same(p, pixels(bare, f)));
    res.push({ mode, item: label, cp: cp(text), tofu: bad, ok: !bad });
  };
  for (const p of PROBES) tofu(p[0], p[1]);
  for (const r of ROWS) {
    tofu(r.kana + " 詳細", r.detail);
    tofu(r.kana + " 長音(合成)", r.longA);
    tofu(r.kana + " 長音(重ね書き)", r.longC);
  }
  // U+0304 must attach to (not add to) the vowel: the marker is exactly as wide as the bare vowel. Only the bundled
  // font promises this; sys is recorded for comparison but only tofu is judged there.
  for (const lv of LONG_VOWELS) {
    const bare = width(lv[1], f), comp = width(lv[1] + "̄", f);
    const ok = mode !== "ja" || Math.abs(bare - comp) < 0.01;
    res.push({ mode, item: "width " + lv[0] + " (" + lv[1] + "+U+0304 == " + lv[1] + ")", ok, widths: { bare, comp } });
    const p = pixels(lv[1] + "̄", f), b = pixels(lv[1], f);
    if (mode === "ja") res.push({ mode, item: "macron visible on " + lv[1], ok: !same(p, b) });
  }
  // ˢʰ: the pair is two glyphs side by side, wider than either alone
  const s = width("ˢ", f), h = width("ʰ", f), sh = width("ˢʰ", f);
  res.push({ mode, item: "ˢʰ width == ˢ + ʰ", ok: Math.abs(sh - s - h) < 0.02 || mode !== "ja", widths: { s, h, sh } });
  return res;
}

(async () => {
  try {
    await Promise.all([
      document.fonts.load('400 48px "Ja Khmer"', "ˢʰᵗᶜʲᶻᶠʸʷᵃᵉⁱᵒᵘ̄"),
      document.fonts.load('400 48px "Noto Sans Khmer"', "តូឆូអា"),
      document.fonts.load('400 48px "Noto Sans"', "abc"),
    ]);
    await document.fonts.ready;
    const results = MODES.flatMap(check);
    const failed = results.filter(r => !r.ok);
    const report = {
      platform, ua: navigator.userAgent, dpr: devicePixelRatio,
      fontsLoaded: [...document.fonts].filter(x => x.status === "loaded").map(x => x.family),
      failed: failed.length, results,
    };
    const st = document.getElementById("status");
    st.textContent = failed.length ? "FAILED " + failed.length + "/" + results.length : "ALL OK " + results.length;
    st.className = failed.length ? "ng" : "ok";
    document.getElementById("report").textContent = JSON.stringify(report.results.filter(r => !r.ok), null, 1) || "";
    await fetch("/report?platform=" + encodeURIComponent(platform), {
      method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(report),
    });
    document.title = "DONE";
  } catch (e) {
    document.getElementById("status").textContent = "ERROR " + e;
    await fetch("/report?platform=" + encodeURIComponent(platform), {
      method: "POST", body: JSON.stringify({ platform, error: String(e) }),
    }).catch(function () {});
  }
})();
</script>
</body>
</html>
