<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glyph Check</title>
<link rel="stylesheet" href="fonts/noto-sans/400.css">
<link rel="stylesheet" href="fonts/noto-sans-jp/400.css">
<link rel="stylesheet" href="fonts/noto-sans-khmer/400.css">
<style>
  /* チ (from Noto Sans JP) + U+032F (from Noto Sans) in ONE font: Chrome/Android needs base+combining mark covered by a single font */
  @font-face { font-family: "Kana C"; src: url("kana-font/kana-c.woff2") format("woff2"); unicode-range: U+30C1, U+032F; }
  /* subset of the full Noto Sans (Google's fontsource subsets lack U+032F): combining low line + modifier letters only */
  @font-face { font-family: "Kana Support"; src: url("kana-font/kana-support.woff2") format("woff2");
    unicode-range: U+032F, U+02B0-02B3, U+02E1, U+1D45, U+1D4A, U+1D4B, U+1D53, U+1D9C, U+1DA4; }
  :root { --bg:#fff; --fg:#111; --line:#ccc; --ng:#c00; --ok:#080; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111; --fg:#eee; --line:#444; --ng:#f66; --ok:#6c6; } }
  body { margin:0; padding:12px 16px; background:var(--bg); color:var(--fg); font:14px/1.5 sans-serif; }
  h1 { font-size:16px; margin:0 0 4px; }
  h2 { font-size:14px; margin:16px 0 4px; }
  #status { font-weight:bold; margin-bottom:8px; }
  .ok { color:var(--ok); } .ng { color:var(--ng); }
  .sys { font-family: sans-serif; }
  .sub { font-family: "Noto Sans Khmer", "Noto Sans JP", "Kana Support", "Noto Sans", sans-serif; }
  .merged { font-family: "Kana C", "Noto Sans Khmer", "Noto Sans JP", "Kana Support", "Noto Sans", sans-serif; }
  .noto { font-family: "Noto Sans Khmer", "Noto Sans JP", "Noto Sans", sans-serif; }
  .row { display:flex; gap:12px; align-items:baseline; border-bottom:1px solid var(--line); padding:4px 0; }
  .row .k { flex:0 0 7em; font-size:11px; opacity:.7; word-break:break-all; }
  .row .v { font-size:28px; }
  .big { font-size:40px; }
  pre { font-size:11px; white-space:pre-wrap; word-break:break-all; }
</style>
</head>
<body>
<h1>Glyph Check</h1>
<div id="status">running…</div>

<h2>system (font-family: sans-serif)</h2>
<div id="sys" class="sys"></div>
<h2>noto (Noto Sans Khmer, JP, Sans 同梱)</h2>
<div id="noto" class="noto"></div>
<h2>sub (Noto Khmer, JP + Kana Support subset)</h2>
<div id="sub" class="sub"></div>
<h2>merged (Kana C: チ+U+032F single font, then Noto)</h2>
<div id="merged" class="merged"></div>
<h2>report</h2>
<pre id="report"></pre>

<script>
const params = new URLSearchParams(location.search);
const platform = params.get("platform") || "unknown";
// ---- test data (source: khmer kana design v0.2) ----
const MODIFIERS = ["ʰ","ˡ","ʳ","ᵋ","ᵓ","ᵅ","ᵊ","ᶤ"];
const SMALL_KANA = ["ㇰ","ㇲ","ㇳ","ㇷ","ㇺ","ㇹ","ㇽ","ァ","ィ","ゥ","ェ","ォ","ッ"];
const CASES = [
  ["ʔɑː kun",  "30AA 1D45 30FC 0020 30AF 30F3"],
  ["tʰlaj",    "31F3 30E9 02E1 30A3"],
  ["srəj",     "31F2 30E9 02B3 1D4A 30A3"],
  ["cʰkae",    "30C1 032F 30AB 30A8"],
  ["ciəŋ",     "30C1 30A2 1D4A 30F3 309A"],
  ["tʰom",     "30C8 02B0 31FA"],
  ["tɨw",      "30C8 30A5 1DA4 30A5"],
  ["cʰap",     "30C1 30E3 02B0 31F7 309A"],
  ["loːk",     "30ED 02E1 30FC 31F0"],
].map(([ipa, cps]) => ({ ipa, cps, text: String.fromCodePoint(...cps.split(" ").map(h => parseInt(h, 16))) }));
const FAMILIES = {
  sys:  "sans-serif",
  noto: '"Noto Sans Khmer","Noto Sans JP","Noto Sans",sans-serif',
  merged: '"Kana C","Noto Sans Khmer","Noto Sans JP","Kana Support","Noto Sans",sans-serif',
  sub:  '"Noto Sans Khmer","Noto Sans JP","Kana Support","Noto Sans",sans-serif',
};

// ---- rendering ----
function row(target, key, text) {
  const d = document.createElement("div"); d.className = "row";
  d.innerHTML = `<span class="k"></span><span class="v"></span>`;
  d.firstChild.textContent = key; d.lastChild.textContent = text;
  document.getElementById(target).appendChild(d);
}
const modeParam = params.get("mode");
const MODES = modeParam ? [modeParam] : ["sys", "noto", "sub", "merged"];
for (const t of ["sys", "noto", "sub", "merged"]) {
  if (!MODES.includes(t)) { document.getElementById(t).previousElementSibling.remove(); document.getElementById(t).remove(); continue; }
  row(t, "modifiers", MODIFIERS.join(" "));
  row(t, "combining", "チ̯ カ゚ ン゚");
  row(t, "small kana", SMALL_KANA.join(" "));
  row(t, "ㇷ+゚ / ヘ", "ㇷ゚ ヘ");
  for (const c of CASES) row(t, c.ipa, c.text);
}

// ---- self check ----
const cv = document.createElement("canvas"); cv.width = 160; cv.height = 90;
const ctx = cv.getContext("2d", { willReadFrequently: true });
const SIZE = 48;
function pixels(text, family) {
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.font = `${SIZE}px ${family}`; ctx.textBaseline = "alphabetic";
  ctx.fillStyle = "#000"; ctx.fillText(text, 8, 60);
  return ctx.getImageData(0, 0, cv.width, cv.height).data;
}
function same(a, b) { for (let i = 3; i < a.length; i += 4) if (a[i] !== b[i]) return false; return true; }
function width(text, family) { ctx.font = `${SIZE}px ${family}`; return ctx.measureText(text).width / SIZE; }
const cp = s => [...s].map(c => c.codePointAt(0).toString(16).toUpperCase().padStart(4, "0")).join(" ");

function check(mode) {
  const f = FAMILIES[mode], res = [];
  const missing = pixels("\u{10FFFE}", f); // reference: what a missing glyph looks like
  for (const m of MODIFIERS) {
    const p = pixels(m, f), w = width(m, f);
    const tofu = same(p, missing) || same(p, pixels("", f));
    // modifier next to kana: should widen the run but stay on the same line height
    const wPair = width("カ" + m, f) - width("カ", f);
    res.push({ mode, item: m, cp: cp(m), tofu, widthEm: +w.toFixed(3), advanceEm: +wPair.toFixed(3),
      ok: !tofu && w > 0.05 && w < 0.85 });
  }
  for (const [base, mark] of [["チ", "̯"], ["カ", "゚"], ["ン", "゚"]]) {
    const withMark = pixels(base + mark, f), bare = pixels(base, f);
    const noEffect = same(withMark, bare);
    // a missing combining glyph is drawn as a box; compare against base + a codepoint no font has
    const tofu = same(withMark, pixels(base + "\u{10FFFE}", f)) || same(pixels(base, f), missing);
    const g = typeof Intl.Segmenter === "function"
      ? [...new Intl.Segmenter("ja", { granularity: "grapheme" }).segment(base + mark)].length : 1; // old Chrome: skip
    // a real combining mark has zero advance; a fallback/tofu box widens the cluster
    const advance = +(width(base + mark, f) - width(base, f)).toFixed(3);
    res.push({ mode, item: base + mark, cp: cp(base + mark), noEffect, tofu, graphemes: g, advance,
      ok: !noEffect && !tofu && g === 1 && Math.abs(advance) < 0.05 });
  }
  for (const k of SMALL_KANA) {
    const p = pixels(k, f);
    res.push({ mode, item: k, cp: cp(k), tofu: same(p, missing), ok: !same(p, missing) });
  }
  // ㇷ゚ must not collapse to ㇷ / パ must not become ハ (regression of the U+309A rule)
  res.push({ mode, item: "ㇷ゚≠ㇷ", ok: !same(pixels("ㇷ゚", f), pixels("ㇷ", f)) });
  for (const c of CASES) {
    const p = pixels(c.text, f);
    res.push({ mode, item: c.ipa, cp: c.cps, ok: cp(c.text) === c.cps && !same(p, missing) });
  }
  return res;
}

(async () => {
  try {
    await Promise.all([
      document.fonts.load('400 48px "Noto Sans JP"', "カチントㇰㇲㇳㇷㇺㇹㇽァィゥェォッ\u309A\u032F" + CASES.map(c => c.text).join("")),
      document.fonts.load('400 48px "Noto Sans Khmer"', "សួស្តី"),
      document.fonts.load('400 48px "Noto Sans"', "ʰˡʳᵋᵓᵅᵊᶤ"),
      document.fonts.load('400 48px "Noto Sans"', "abc"),
      document.fonts.load('400 48px "Kana C"', "チ\u032F"),
      document.fonts.load('400 48px "Kana Support"', "\u032F\u02B0\u02E1\u02B3\u1D4B\u1D53\u1D45\u1D4A\u1DA4"),
    ]);
    await document.fonts.ready;
    const results = MODES.flatMap(check);
    const failed = results.filter(r => !r.ok);
    const report = {
      platform, segmenter: typeof Intl.Segmenter === "function", ua: navigator.userAgent, dpr: devicePixelRatio,
      fontsLoaded: [...document.fonts].filter(x => x.status === "loaded").map(x => `${x.family} ${x.unicodeRange || ""}`.trim()),
      failed: failed.length, results,
    };
    const st = document.getElementById("status");
    st.textContent = failed.length ? `FAILED ${failed.length}/${results.length}` : `ALL OK ${results.length}`;
    st.className = failed.length ? "ng" : "ok";
    document.getElementById("report").textContent = JSON.stringify(report.results.filter(r => !r.ok), null, 1) || "";
    await fetch(`/report?platform=${encodeURIComponent(platform)}`, {
      method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(report),
    });
    document.title = "DONE";
  } catch (e) {
    document.getElementById("status").textContent = "ERROR " + e;
    await fetch(`/report?platform=${encodeURIComponent(platform)}`, {
      method: "POST", body: JSON.stringify({ platform, error: String(e) }),
    }).catch(() => {});
  }
})();
</script>
</body>
</html>
