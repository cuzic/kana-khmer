<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YT Prosody</title>
<style>
  :root { color-scheme: light dark; --rule: #c9d1db; --accent: #2457b8; --muted: #667; }
  body { margin: 0; padding: 12px 14px; width: 300px; font: 13px/1.5 "Noto Sans JP", system-ui, sans-serif; }
  h1 { font-size: 14px; margin: 0 0 8px; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; align-items: center; }
  .lab { color: var(--muted); font-size: 12px; }
  button { font: inherit; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--rule); background: transparent; color: inherit; cursor: pointer; }
  button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
  .layers { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; }
  .note { color: var(--muted); font-size: 11px; margin-top: 10px; }
</style>
<h1>YT Prosody(PoC)</h1>
<label><input type="checkbox" id="enabled"> 字幕に重ねて表示する</label>
<div class="row" id="presets"><span class="lab">プリセット</span></div>
<div class="layers" id="layers"></div>
<p class="note">YouTube の字幕(CC)をオンにしてください。表示は規則による推定で、誤りを含みます。</p>
<script src="popup.js"></script>
