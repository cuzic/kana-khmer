# タイ語話者向けの日本語あいさつ 50 件(案・第2版。基本 40 件 + 「喜ばれるひとこと」10 件)。丁寧語のみ、1フレーズ=1カード(ADR-0020)。表示要素は ADR-0022 に準ずる:
# 漢字かな交じり(text)・ふりがな(furigana、ひらがな。カタカナ語は かーど のようにひらがな+ー)・ローマ字(pron から生成)・タイ語訳(gloss)。
# gloss・usage のタイ語(สำนวนภาษาไทยเป็นร่างที่ยังไม่ได้ให้เจ้าของภาษาตรวจ)、日本語の自然さ、furigana、pron(発音を確定したカタカナ)、語の切り方(parts)はすべて未確認(review: すべて false)。ネイティブ確認後に true にする。
# parts は必須。連結すると text・furigana・pron が本文と一致する(content のビルドで検証)。助詞は独立した part。words は parts と同じ内容(単語タップ用)。
# 聞き取り表現(相手が言うもの)は usage の先頭に「[ประโยคที่ได้ยิน]」。

- id: hello
