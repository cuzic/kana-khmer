  gloss: "สวัสดี"
  usage: "ใช้ทักทายตั้งแต่ช่วงกลางวันจนถึงเย็น เหมาะกับตอนเข้าร้านหรือเมื่อพบใครเป็นครั้งแรก ที่ญี่ปุ่นไม่มีการไหว้ แค่ก้มศีรษะเล็กน้อยก็พอ"
  variants:
    - speaker: any
      register: polite
      text: こんにちは
      furigana: こんにちは
      pron: コンニチワ
      audio: hello.m4a
      parts:
        - { text: こんにちは, furigana: こんにちは, pron: コンニチワ, gloss: "สวัสดี", pos: interj }
  words:
    - { text: こんにちは, pron: コンニチワ, gloss: "สวัสดี" }
  review: { pron: false, audio: false, usage: false }
  audioSource: tts

