# 韓国語話者向けの日本語あいさつ 50 件(案・第2版。基本 40 件 + 「喜ばれるひとこと」10 件)。丁寧語のみ、1フレーズ=1カード(ADR-0020)。表示要素は ADR-0022:
# 漢字かな交じり(text)・ふりがな(furigana、ひらがな。カタカナ語は かーど のようにひらがな+ー)・ローマ字(pron から生成)・ハングル(pron から生成)・韓国語訳(gloss)。
# gloss・usage の韓国語、日本語の自然さ、furigana、pron(発音を確定したカタカナ)、語の切り方(parts)はすべて未確認(review: すべて false)。ネイティブ確認後に true にする。
# parts は必須。連結すると text・furigana・pron が本文と一致する(content のビルドで検証)。助詞は独立した part。words は parts と同じ内容(単語タップ用)。
# 聞き取り表現(相手が言うもの)は usage の先頭に「[듣는 표현]」。

- id: hello
