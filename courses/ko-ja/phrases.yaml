  gloss: "안녕하세요"
  usage: "낮부터 저녁 무렵까지 쓰는 기본 인사예요. 가게에 들어갈 때나 사람을 만났을 때 첫마디로 좋아요."
  variants:
    - speaker: any
      register: polite
      text: こんにちは
      furigana: こんにちは
      pron: コンニチワ
      audio: hello.m4a
      parts:
        - { text: こんにちは, furigana: こんにちは, pron: コンニチワ, gloss: "안녕하세요", pos: interj }
  words:
