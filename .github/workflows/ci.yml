name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # apps/web は COURSE でコースを選ぶ(ADR-0020)。既定の ja-km は上の typecheck。ko-ja も型と生成が通ること
      - run: COURSE=ko-ja pnpm --filter web typecheck
      - run: pnpm test
      - run: pnpm --filter content check --course ja-km
      - run: pnpm --filter content check --course ko-ja
