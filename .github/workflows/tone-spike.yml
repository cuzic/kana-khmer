name: tone-spike

# Spike for docs/tone-spike.md: does a tone contour centred on a whole syllable work with a font alone?
# Screenshots of tools/glyph-check/public/tone-spike.html on the iOS simulator and Android API 29/34.
on:
  workflow_dispatch:
  push:
    paths:
      - "tools/glyph-check/public/tone-spike.html"
      - "tools/glyph-check/public/kana-font/tone-spike-*.woff2"
      - "tools/glyph-check/scripts/android-spike.sh"
      - ".github/workflows/tone-spike.yml"

defaults:
  run:
    working-directory: tools/glyph-check

env:
  VIEWS: "hint wj zwsp pua plain"

jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Start static server
        run: nohup node scripts/server.mjs > server.log 2>&1 &
      - name: Boot iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          c=[x for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')]
          print(c[-1]['udid'])")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
      - name: Open pages in Safari and capture
        run: |
          mkdir -p artifacts
          for view in $VIEWS; do
            for attempt in 1 2 3; do
              xcrun simctl openurl "$UDID" "http://localhost:8000/tone-spike.html?view=$view&platform=ios-$view" && break
              echo "openurl attempt $attempt failed"; sleep 10
            done
            for i in $(seq 1 60); do [ -f "artifacts/report-ios-$view.json" ] && break; sleep 1; done
            sleep 4
            xcrun simctl io "$UDID" screenshot "artifacts/ios-$view.png"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: ios, path: "tools/glyph-check/artifacts/*\ntools/glyph-check/server.log" }

  android:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 34]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Start static server
        run: nohup node scripts/server.mjs > server.log 2>&1 &
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          API_LEVEL: ${{ matrix.api-level }}
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          working-directory: tools/glyph-check
          script: bash scripts/android-spike.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "android-api${{ matrix.api-level }}", path: "tools/glyph-check/artifacts/*\ntools/glyph-check/server.log" }
