name: web-screenshots

on:
  workflow_dispatch:

env:
  SHOTS: "|scene=thanks-sorry&notation=full|scene=intro&notation=full|scene=oneliners&notation=full|guide&notation=full"

jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web build
      - name: Serve
        run: nohup pnpm --filter web exec vite preview > server.log 2>&1 &
      - name: Boot iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          c=[x for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')]
          print(c[-1]['udid'])")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
      - name: Capture
        run: |
          mkdir -p artifacts
          i=0
          IFS='|' read -ra QS <<< "$SHOTS"
          for q in "${QS[@]}"; do
            i=$((i+1))
            for attempt in 1 2 3; do
              xcrun simctl openurl "$UDID" "http://localhost:8000/?${q}" && break
              echo "openurl attempt $attempt failed"; sleep 10
            done
            sleep 12
            xcrun simctl io "$UDID" screenshot "artifacts/ios-$i.png"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: ios, path: "artifacts/*\nserver.log" }

  android:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 34]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web build
      - name: Serve
        run: nohup pnpm --filter web exec vite preview > server.log 2>&1 &
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          API_LEVEL: ${{ matrix.api-level }}
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: bash .github/scripts/web-android.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "android-api${{ matrix.api-level }}", path: "artifacts/*\nserver.log" }
